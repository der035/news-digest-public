<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>每日新闻摘要 · Daily Briefing</title>
<link rel="alternate" type="application/rss+xml" title="每日新闻摘要 RSS" href="./digest.xml">
<style>
:root{color-scheme:light;--ink:#142034;--muted:#64748b;--line:#e5e9ef;--blue:#275bd5}
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#101827;color:#fff;padding:66px 24px 54px}header>div,main,footer{max-width:880px;margin:auto}
.kicker{font-size:12px;letter-spacing:.18em;color:#aebed6;font-weight:700}h1{font-size:clamp(32px,6vw,52px);line-height:1.25;margin:16px 0}header p{color:#c6d2e2;max-width:620px}
main{padding:35px 20px 60px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h2{font-size:22px;margin:0}.button{display:inline-block;padding:9px 17px;background:var(--blue);color:white;border-radius:10px;text-decoration:none;font-weight:600}
.status{padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--muted);margin-bottom:18px}
article{background:white;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:12px}
article h3{font-size:19px;line-height:1.5;margin:0 0 8px}article a{color:var(--ink);text-decoration:none}article a:hover{color:var(--blue)}article p{color:var(--muted);margin:0;font-size:14px;overflow-wrap:anywhere}
footer{border-top:1px solid var(--line);padding:20px;color:var(--muted);font-size:13px}footer a{color:var(--blue)}
</style>
</head>
<body>
<header><div><div class="kicker">DAILY NEWS DIGEST</div><h1>每日新闻摘要</h1><p>从多个可靠资讯来源汇集最新动态。中文精选与背景解读正在建设中；目前先展示原始新闻标题及原文链接。</p></div></header>
<main>
<div class="toolbar"><h2>最新资讯</h2><a class="button" href="./digest.xml" id="rss">订阅 RSS</a></div>
<div id="status" class="status" role="status">正在检查最新内容…</div>
<div id="articles"></div>
</main>
<footer>新闻版权归原发布者所有 · <a href="https://github.com/der035/news-digest-public">公开发布仓库</a> · 本站不代表新闻来源立场</footer>
<script>
(async function(){
const status=document.getElementById('status'),list=document.getElementById('articles');
try{
 const response=await fetch('./digest.xml',{cache:'no-store'});
 if(!response.ok)throw Error('RSS 尚未发布（HTTP '+response.status+'）');
 const xml=new DOMParser().parseFromString(await response.text(),'application/xml');
 if(xml.querySelector('parsererror'))throw Error('RSS 格式解析失败');
 const items=[...xml.querySelectorAll('channel > item')];
 if(!items.length){status.textContent='RSS 已发布，但暂时没有新闻条目。';return;}
 status.textContent='已加载 '+items.length+' 条新闻。点击标题阅读原文。';
 for(const item of items){
  const title=item.querySelector('title')?.textContent||'未命名新闻';
  const url=item.querySelector('link')?.textContent||'';
  if(!/^https?:\/\//i.test(url))continue;
  const article=document.createElement('article'),h=document.createElement('h3'),a=document.createElement('a'),p=document.createElement('p');
  a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=title;h.append(a);
  p.textContent=item.querySelector('description')?.textContent||'阅读原文了解详情';
  article.append(h,p);list.append(article);
 }
}catch(error){status.textContent='新闻订阅源尚未接入公开站点。自动发布配置完成后，这里将显示最新内容。';document.getElementById('rss').style.display='none';}
})();
</script>
</body></html>
